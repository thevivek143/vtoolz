<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Stack Tower | Vibox Arcade</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #030308;
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --text-color: #f0f0f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 640px;
            aspect-ratio: 400 / 640;
            background: linear-gradient(180deg, #090915 0%, #030308 100%);
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.12);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 8, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 10px rgba(120, 255, 214, 0.3));
        }

        .subtitle {
            font-size: 0.95rem;
            color: #8fa0dd;
            margin-bottom: 30px;
            max-width: 80%;
            line-height: 1.4;
        }

        .btn-play {
            background: linear-gradient(135deg, #a8ff78 0%, #78ffd6 100%);
            border: none;
            color: #030308;
            padding: 14px 40px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(120, 255, 214, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(120, 255, 214, 0.6);
        }

        .btn-play:active {
            transform: scale(0.98);
        }

        .score-display {
            font-size: 1.2rem;
            color: #8fa0dd;
            margin-bottom: 20px;
        }

        .score-val {
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            display: block;
            margin-top: 5px;
            text-shadow: 0 0 10px rgba(120, 255, 214, 0.5);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }

        .hud-score-container {
            display: flex;
            flex-direction: column;
        }

        .hud-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6a7bb0;
        }

        .hud-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 5px rgba(120, 255, 214, 0.5);
        }

        /* Combo indicator */
        #comboIndicator {
            position: absolute;
            top: 80px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 1rem;
            font-weight: 800;
            color: #a8ff78;
            text-shadow: 0 0 8px #a8ff78;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
        }

        #comboIndicator.active {
            opacity: 1;
            transform: translateY(0);
        }

        .tap-instruction {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            color: #6a7bb0;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            animation: pulseFade 1.5s infinite;
            z-index: 4;
        }

        @keyframes pulseFade {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- HUD -->
        <div id="hud">
            <div class="hud-score-container">
                <span class="hud-label">Score</span>
                <span id="scoreVal" class="hud-value">0</span>
            </div>
            <div class="hud-score-container" style="text-align: right;">
                <span class="hud-label">Best</span>
                <span id="bestVal" class="hud-value">0</span>
            </div>
        </div>

        <!-- Combo indicator -->
        <div id="comboIndicator">PERFECT x0</div>

        <!-- Canvas -->
        <canvas id="gameCanvas" width="400" height="640"></canvas>

        <div class="tap-instruction" id="tapInstruction">Tap screen to Stack!</div>

        <!-- Start Screen -->
        <div id="startScreen" class="overlay active">
            <h1>Stack Tower</h1>
            <p class="subtitle">Stack moving blocks on top of each other. Overlapping edges will be cut off!</p>
            <div class="score-display">
                High Score
                <span id="startBest" class="score-val">0</span>
            </div>
            <button class="btn-play" id="btnStart">
                <i class="fas fa-play"></i> Play Game
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="overlay">
            <h1 style="background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Tower Fell!</h1>
            <p class="subtitle" style="margin-bottom: 20px;">You missed the stack completely.</p>
            <div class="score-display">
                Score
                <span id="overScore" class="score-val">0</span>
            </div>
            <button class="btn-play" id="btnRestart" style="background: linear-gradient(135deg, #ff0844 0%, #ff4b2b 100%); color: white; box-shadow: 0 0 20px rgba(255, 75, 43, 0.4);">
                <i class="fas fa-rotate-right"></i> Try Again
            </button>
        </div>
    </div>

    <script>
        // ========================================================
        // WEB AUDIO RETRO SYNTHESIZER
        // ========================================================
        class SoundFX {
            constructor() {
                this.ctx = null;
                // Perfect chime pitches (musical scales - major pentatonic)
                this.pitches = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playPerfect(streak) {
                this.init();
                if (!this.ctx) return;
                
                let pitchIndex = Math.min(streak, this.pitches.length - 1);
                let freq = this.pitches[pitchIndex];

                let osc = this.ctx.createOscillator();
                let osc2 = this.ctx.createOscillator();
                let gain = this.ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                // Add nice sine overtone for chime feel
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(freq * 2, this.ctx.currentTime);

                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);

                osc.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc2.start();
                osc.stop(this.ctx.currentTime + 0.35);
                osc2.stop(this.ctx.currentTime + 0.35);
            }
            playNormal() {
                this.init();
                if (!this.ctx) return;
                
                // Warm wooden knock
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            playCut() {
                this.init();
                if (!this.ctx) return;

                // Descending noise click
                let bufferSize = this.ctx.sampleRate * 0.15;
                let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                let noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                let filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(600, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);

                let gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();
            }
            playCrash() {
                this.init();
                if (!this.ctx) return;
                
                // Low rumble explosion
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(110, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.55, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }
        }

        const sfx = new SoundFX();

        // ========================================================
        // GAME LOGIC
        // ========================================================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // High scores
        let bestScore = parseInt(localStorage.getItem("st_bestScore")) || 0;
        document.getElementById("bestVal").textContent = bestScore;
        document.getElementById("startBest").textContent = bestScore;

        const startScreen = document.getElementById("startScreen");
        const gameOverScreen = document.getElementById("gameOverScreen");
        const scoreVal = document.getElementById("scoreVal");
        const overScore = document.getElementById("overScore");
        const comboIndicator = document.getElementById("comboIndicator");
        const tapInstruction = document.getElementById("tapInstruction");

        const STATES = { START: 0, PLAYING: 1, GAMEOVER: 2 };
        let gameState = STATES.START;

        // Variables
        let score = 0;
        let stack = [];
        let debris = [];
        let particles = [];
        let activeBlock = null;
        let cameraY = 0;
        let targetCameraY = 0;

        // Configuration
        const blockHeight = 18;
        const baseGridSize = 4.2; // in grid coordinates
        let currentW = baseGridSize;
        let currentD = baseGridSize;
        let blockSpeed = 0.07;
        let axisMultiplier = 1; // alternating axes

        // Combo streaks
        let perfectStreak = 0;

        // --- GRID ISOMETRIC PROJECTION CALCULATION ---
        function getScreenPos(gridX, gridZ, h, camY) {
            // Isometric mapping formula:
            // x shifts along X axis (+30 deg): screenX += cos(30)*scaling
            // z shifts along Z axis (+150 deg): screenX -= cos(30)*scaling
            // Height moves straight up (-Y axis)
            const sX = canvas.width / 2 + (gridX - gridZ) * 22;
            const sY = 410 + (gridX + gridZ) * 11 - h * blockHeight + camY;
            return { x: sX, y: sY };
        }

        // --- ISOMETRIC BOX DRAW HELPER ---
        function drawIsoBox(x, z, w, d, h, hue, camY, isDebris = false, alpha = 1) {
            const pos = getScreenPos(x, z, h, camY);
            const sX = pos.x;
            const sY = pos.y;

            // Coordinate step conversions:
            const wStepX = w * 22;
            const wStepY = w * 11;
            const dStepX = -d * 22;
            const dStepY = d * 11;

            ctx.save();
            ctx.globalAlpha = alpha;

            // 1. Draw Top face (Rhombus)
            ctx.beginPath();
            ctx.moveTo(sX, sY);
            ctx.lineTo(sX + wStepX, sY + wStepY);
            ctx.lineTo(sX + wStepX + dStepX, sY + wStepY + dStepY);
            ctx.lineTo(sX + dStepX, sY + dStepY);
            ctx.closePath();
            ctx.fillStyle = `hsl(${hue}, 80%, 62%)`;
            ctx.fill();

            // 2. Draw Left face
            ctx.beginPath();
            ctx.moveTo(sX + dStepX, sY + dStepY);
            ctx.lineTo(sX + wStepX + dStepX, sY + wStepY + dStepY);
            ctx.lineTo(sX + wStepX + dStepX, sY + wStepY + dStepY + blockHeight);
            ctx.lineTo(sX + dStepX, sY + dStepY + blockHeight);
            ctx.closePath();
            ctx.fillStyle = `hsl(${hue}, 70%, 42%)`;
            ctx.fill();

            // 3. Draw Right face
            ctx.beginPath();
            ctx.moveTo(sX + wStepX, sY + wStepY);
            ctx.lineTo(sX + wStepX + dStepX, sY + wStepY + dStepY);
            ctx.lineTo(sX + wStepX + dStepX, sY + wStepY + dStepY + blockHeight);
            ctx.lineTo(sX + wStepX, sY + wStepY + blockHeight);
            ctx.closePath();
            ctx.fillStyle = `hsl(${hue}, 70%, 32%)`;
            ctx.fill();

            ctx.restore();
        }

        // --- BLOCK BUILDER ---
        class Block {
            constructor(x, z, w, d, h, isSliding = false, slideAxis = 'x') {
                this.x = x;
                this.z = z;
                this.w = w;
                this.d = d;
                this.h = h;
                this.hue = (h * 7) % 360;
                
                this.isSliding = isSliding;
                this.slideAxis = slideAxis;
                
                // Sliding math
                this.slideRange = 6.2; // movement bounds
                this.slidePos = -this.slideRange;
                this.slideDir = 1;
            }

            update() {
                if (!this.isSliding) return;
                
                this.slidePos += this.slideDir * (blockSpeed + Math.min(score * 0.0018, 0.05));
                
                if (this.slidePos >= this.slideRange) {
                    this.slidePos = this.slideRange;
                    this.slideDir = -1;
                } else if (this.slidePos <= -this.slideRange) {
                    this.slidePos = -this.slideRange;
                    this.slideDir = 1;
                }

                if (this.slideAxis === 'x') {
                    this.x = this.slidePos;
                } else {
                    this.z = this.slidePos;
                }
            }

            draw(camY) {
                drawIsoBox(this.x, this.z, this.w, this.d, this.h, this.hue, camY);
            }
        }

        // --- DEBRIS (FALLING PIECES) ---
        class DebrisPiece {
            constructor(x, z, w, d, h, hue) {
                this.x = x;
                this.z = z;
                this.w = w;
                this.d = d;
                this.h = h;
                this.hue = hue;
                
                this.vy = 0;
                this.gravity = 0.5;
                this.alpha = 1.0;
                this.life = 60; // frames
            }

            update() {
                this.vy += this.gravity;
                this.h -= this.vy * 0.04; // fall down along grid coordinates height
                this.alpha -= 0.018;
                this.life--;
            }

            draw(camY) {
                if (this.alpha <= 0) return;
                drawIsoBox(this.x, this.z, this.w, this.d, this.h, this.hue, camY, true, this.alpha);
            }
        }

        // --- PARTICLES ---
        function createPerfectParticles(gridX, gridZ, h) {
            const pos = getScreenPos(gridX, gridZ, h, cameraY);
            const count = 12;
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const spd = 2.5 + Math.random() * 3.5;
                particles.push({
                    x: pos.x,
                    y: pos.y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd - 1,
                    size: 3 + Math.random() * 4,
                    color: '#a8ff78',
                    alpha: 1,
                    life: 30 + Math.random() * 20
                });
            }
        }

        // --- INIT STATE ---
        function initGame() {
            score = 0;
            scoreVal.textContent = 0;
            perfectStreak = 0;
            currentW = baseGridSize;
            currentD = baseGridSize;
            stack = [];
            debris = [];
            particles = [];
            cameraY = 0;
            targetCameraY = 0;

            // Spawn wide base block at h = 0
            stack.push(new Block(0, 0, baseGridSize, baseGridSize, 0));
            
            // Spawn first sliding block
            spawnNextBlock();
        }

        function spawnNextBlock() {
            const nextH = stack.length;
            const topBlock = stack[stack.length - 1];

            // Alternate axis X and Z
            const axis = nextH % 2 === 1 ? 'x' : 'z';
            
            // Spawn coordinate: start sliding from offscreen bounds
            let startX = topBlock.x;
            let startZ = topBlock.z;

            activeBlock = new Block(startX, startZ, currentW, currentD, nextH, true, axis);
        }

        function triggerGameOver() {
            gameState = STATES.GAMEOVER;
            sfx.playCrash();

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem("st_bestScore", bestScore);
                document.getElementById("bestVal").textContent = bestScore;
                document.getElementById("startBest").textContent = bestScore;
            }

            overScore.textContent = score;
            gameOverScreen.classList.add("active");
            comboIndicator.classList.remove("active");
            tapInstruction.style.display = "none";
        }

        // --- STACK PLACE ATTEMPT LOGIC ---
        function placeBlock() {
            if (gameState !== STATES.PLAYING || !activeBlock) return;

            const base = stack[stack.length - 1];
            let perfect = false;

            if (activeBlock.slideAxis === 'x') {
                const diff = activeBlock.x - base.x;
                const absDiff = Math.abs(diff);

                // 1. Check Perfect Landing (within 0.12 grid units)
                if (absDiff < 0.12) {
                    perfect = true;
                    activeBlock.x = base.x; // Align perfectly
                } else {
                    // 2. Cut off overlap
                    if (activeBlock.x < base.x) {
                        // Left overhang
                        const overhangW = base.x - activeBlock.x;
                        if (overhangW >= activeBlock.w) {
                            // Miss completely!
                            triggerGameOver();
                            return;
                        }
                        // Create falling debris
                        debris.push(new DebrisPiece(activeBlock.x, activeBlock.z, overhangW, activeBlock.d, activeBlock.h, activeBlock.hue));
                        // New block size shrinks
                        currentW = activeBlock.w - overhangW;
                        activeBlock.x = base.x;
                        activeBlock.w = currentW;
                    } else {
                        // Right overhang
                        const overhangW = (activeBlock.x + activeBlock.w) - (base.x + base.w);
                        if (overhangW >= activeBlock.w) {
                            // Miss completely!
                            triggerGameOver();
                            return;
                        }
                        // Create falling debris
                        debris.push(new DebrisPiece(base.x + base.w, activeBlock.z, overhangW, activeBlock.d, activeBlock.h, activeBlock.hue));
                        // New block size shrinks
                        currentW = activeBlock.w - overhangW;
                        activeBlock.w = currentW;
                    }
                }
            } else {
                // Sliding along Z axis
                const diff = activeBlock.z - base.z;
                const absDiff = Math.abs(diff);

                // 1. Check Perfect Landing
                if (absDiff < 0.12) {
                    perfect = true;
                    activeBlock.z = base.z;
                } else {
                    // 2. Cut off Z overlap
                    if (activeBlock.z < base.z) {
                        const overhangD = base.z - activeBlock.z;
                        if (overhangD >= activeBlock.d) {
                            triggerGameOver();
                            return;
                        }
                        debris.push(new DebrisPiece(activeBlock.x, activeBlock.z, activeBlock.w, overhangD, activeBlock.h, activeBlock.hue));
                        currentD = activeBlock.d - overhangD;
                        activeBlock.z = base.z;
                        activeBlock.d = currentD;
                    } else {
                        const overhangD = (activeBlock.z + activeBlock.d) - (base.z + base.d);
                        if (overhangD >= activeBlock.d) {
                            triggerGameOver();
                            return;
                        }
                        debris.push(new DebrisPiece(activeBlock.x, base.z + base.d, activeBlock.w, overhangD, activeBlock.h, activeBlock.hue));
                        currentD = activeBlock.d - overhangD;
                        activeBlock.d = currentD;
                    }
                }
            }

            // Lock block into active stack list
            activeBlock.isSliding = false;
            stack.push(activeBlock);
            score++;
            scoreVal.textContent = score;

            // Handle landing sound / feedback
            if (perfect) {
                perfectStreak++;
                sfx.playPerfect(perfectStreak);
                createPerfectParticles(activeBlock.x + activeBlock.w/2, activeBlock.z + activeBlock.d/2, activeBlock.h);
                
                // Show floating combo text
                comboIndicator.textContent = `PERFECT x${perfectStreak}`;
                comboIndicator.classList.add("active");
                
                // Combo reward: Every 6 perfect stacks, expand current blocks slightly
                if (perfectStreak > 0 && perfectStreak % 6 === 0) {
                    // Expand size up to maximum
                    currentW = Math.min(baseGridSize, currentW + 0.35);
                    currentD = Math.min(baseGridSize, currentD + 0.35);
                    // play success shine indicator
                }
            } else {
                perfectStreak = 0;
                comboIndicator.classList.remove("active");
                sfx.playNormal();
                sfx.playCut();
            }

            // Smooth camera offset moves up: keep center at highest platform
            targetCameraY = (stack.length - 1) * blockHeight;

            // Spawn new sliding block
            spawnNextBlock();
        }

        // ========================================================
        // USER INPUTS
        // ========================================================
        function handleInput(e) {
            e.preventDefault();
            if (gameState === STATES.PLAYING) {
                placeBlock();
                tapInstruction.style.opacity = 0;
            }
        }

        // Mouse + touch triggers
        canvas.addEventListener("touchstart", handleInput, { passive: false });
        canvas.addEventListener("mousedown", handleInput);

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowDown" || e.code === "Enter") {
                e.preventDefault();
                if (gameState === STATES.PLAYING) placeBlock();
            }
        });

        // UI BUTTON EVENTS
        document.getElementById("btnStart").addEventListener("click", () => {
            sfx.init();
            startScreen.classList.remove("active");
            gameState = STATES.PLAYING;
            tapInstruction.style.display = "block";
            initGame();
        });

        document.getElementById("btnRestart").addEventListener("click", () => {
            gameOverScreen.classList.remove("active");
            gameState = STATES.PLAYING;
            tapInstruction.style.display = "block";
            initGame();
        });

        // ========================================================
        // ENGINE TICK MAIN LOOP
        // ========================================================
        function tick() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === STATES.PLAYING || gameState === STATES.GAMEOVER) {
                // Smooth camera scrolling follow top block height
                cameraY += (targetCameraY - cameraY) * 0.08;

                // 1. Draw static stack list
                stack.forEach(blk => blk.draw(cameraY));

                // 2. Update and draw active moving block
                if (activeBlock) {
                    activeBlock.update();
                    activeBlock.draw(cameraY);
                }

                // 3. Update and draw physical debris pieces
                debris.forEach((db, idx) => {
                    db.update();
                    if (db.life <= 0) {
                        debris.splice(idx, 1);
                        return;
                    }
                    db.draw(cameraY);
                });

                // 4. Update and draw sparkle particles
                particles.forEach((pt, idx) => {
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.vy += 0.06; // micro-gravity
                    pt.alpha -= 0.035;
                    pt.life--;

                    if (pt.life <= 0 || pt.alpha <= 0) {
                        particles.splice(idx, 1);
                        return;
                    }

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                    ctx.fillStyle = pt.color;
                    ctx.globalAlpha = pt.alpha;
                    ctx.fill();
                    ctx.restore();
                });
            }

            requestAnimationFrame(tick);
        }

        // Start render ticker
        requestAnimationFrame(tick);

    </script>
</body>
</html>
