name: Validate static app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check catalogue, links, offline assets, and JavaScript
        shell: pwsh
        run: ./scripts/validate.ps1

